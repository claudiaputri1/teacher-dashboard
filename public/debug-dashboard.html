<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard Stats</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #f5f5f5; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: white; padding: 10px; overflow-x: auto; border-radius: 4px; }
        .stat { display: inline-block; margin: 10px; padding: 10px 20px; background: white; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        .loading { display: none; }
        .loading.show { display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>🔍 Debug Dashboard Stats</h1>
    <p>Test untuk melihat kenapa stats tidak muncul di dashboard</p>

    <button onclick="testStats()">Test Dashboard Stats API</button>
    <span class="loading" id="loading">⏳ Loading...</span>

    <div id="result"></div>

    <script>
        async function testStats() {
            const resultDiv = document.getElementById('result');
            const loadingSpan = document.getElementById('loading');

            resultDiv.innerHTML = '';
            loadingSpan.classList.add('show');

            try {
                console.log('🚀 Starting stats fetch...');
                const startTime = Date.now();

                const response = await fetch('/api/dashboard/stats', {
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'include'
                });

                const endTime = Date.now();
                const duration = endTime - startTime;

                console.log(`✅ Response received in ${duration}ms`);
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('📊 Data received:', data);

                resultDiv.innerHTML = `
                    <div class="card success">
                        <h2>✅ Success!</h2>
                        <p><strong>Request duration:</strong> ${duration}ms</p>
                        <p><strong>Response status:</strong> ${response.status}</p>
                    </div>

                    <div class="card">
                        <h3>Stats Values:</h3>
                        <div class="stat">
                            <strong>Total Students:</strong> ${data.total_students}
                        </div>
                        <div class="stat">
                            <strong>Avg Progress:</strong> ${data.avg_progress}%
                        </div>
                        <div class="stat">
                            <strong>Pending Tasks:</strong> ${data.pending_tasks}
                        </div>
                        <div class="stat">
                            <strong>Engagement Rate:</strong> ${data.engagement_rate}%
                        </div>
                    </div>

                    <div class="card">
                        <h3>Change Indicators:</h3>
                        <ul>
                            <li><strong>Students Change:</strong> ${data.students_change}</li>
                            <li><strong>Progress Change:</strong> ${data.progress_change}</li>
                            <li><strong>Tasks Change:</strong> ${data.tasks_change}</li>
                            <li><strong>Engagement Change:</strong> ${data.engagement_change}</li>
                        </ul>
                    </div>

                    <div class="card">
                        <h3>Raw JSON Response:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;

                // Check if any change indicator contains "Error"
                const hasError = data.students_change.includes('Error') ||
                                data.progress_change.includes('Error') ||
                                data.tasks_change.includes('Error') ||
                                data.engagement_change.includes('Error');

                if (hasError) {
                    resultDiv.innerHTML = `<div class="card error">
                        <h2>⚠️ Warning: Error in change indicators</h2>
                        <p>Beberapa change indicator menampilkan "Error loading data"</p>
                    </div>` + resultDiv.innerHTML;
                }

            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `
                    <div class="card error">
                        <h2>❌ Error</h2>
                        <p><strong>Message:</strong> ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            } finally {
                loadingSpan.classList.remove('show');
            }
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            console.log('Page loaded, waiting 1 second before testing...');
            setTimeout(testStats, 1000);
        });
    </script>
</body>
</html>
