<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dashboard API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre {
            background: #fff;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Test Dashboard API</h1>
    <p>Klik tombol di bawah untuk test API endpoints:</p>

    <button onclick="testStatsAPI()">Test Stats API</button>
    <button onclick="testClassroomAPI()">Test Classroom API</button>
    <button onclick="testProgressAPI()">Test Progress API</button>
    <button onclick="testAssessmentAPI()">Test Assessment API</button>

    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');

        async function testAPI(endpoint, title) {
            try {
                resultsDiv.innerHTML += `<div class="test-result"><strong>Testing: ${title}</strong><br>Loading...</div>`;

                const response = await fetch(endpoint, {
                    credentials: 'include', // Include cookies for session
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    resultsDiv.innerHTML += `
                        <div class="test-result success">
                            <strong>✅ ${title} - SUCCESS</strong><br>
                            Status: ${response.status}<br>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML += `
                        <div class="test-result error">
                            <strong>❌ ${title} - FAILED</strong><br>
                            Status: ${response.status}<br>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="test-result error">
                        <strong>❌ ${title} - ERROR</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        function testStatsAPI() {
            resultsDiv.innerHTML = '';
            testAPI('/api/dashboard/stats', 'Dashboard Stats API');
        }

        function testClassroomAPI() {
            resultsDiv.innerHTML = '';
            testAPI('/api/dashboard/classroom', 'Classroom API');
        }

        function testProgressAPI() {
            resultsDiv.innerHTML = '';
            testAPI('/api/dashboard/progress', 'Progress API');
        }

        function testAssessmentAPI() {
            resultsDiv.innerHTML = '';
            testAPI('/api/dashboard/assessment', 'Assessment API');
        }
    </script>
</body>
</html>
